<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Grenze:ital,wght@0,100..900;1,100..900&display=swap");
    </style>
    <title>Form</title>
</head>
<body>
    <div class="container">
      <div class="image-side">
        <img
          class="background-image"
          src="./images/northern-lights.jpg"
          alt="The northern lights"
        />

        <div class="logo-background">
          <img class="logo" src="./images/odin-lined.png" alt="Odin logo" />
        </div>

        <p class="photo-credit">
          Photo by
          <a
            href="https://unsplash.com/@lucasmarcomini?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
            >Lucas Marcomini</a
          >
          on
          <a
            href="https://unsplash.com/photos/northern-light-at-night-cVBz9q1T_9M?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
            >Unsplash</a
          >
        </p>
      </div>

      <div class="form-side">
        <p>
          This is not a real online service! You know you need something like
          this in your life to help you realize your deepest dreams.
          <br />
          Sign up <em>now</em> to get started.
        </p>

        <p class="emphasis">You <em>know</em> you want to.</p>

        <form method="post">
          <div class="form-item">
            <label for="first-name">First Name *</label>
            <input id="first-name" name="first-name" type="text" required />
          </div>

          <div class="form-item">
            <label for="last-name">Last Name *</label>
            <input id="last-name" name="last-name" type="text" required />
          </div>

          <div class="form-item">
            <label for="email">Email *</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="johnsmith@email.com"
              required
            />
          </div>

          <div class="form-item">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" />
          </div>

          <div class="form-item">
            <label for="password">Password *</label>
            <input type="password" id="password" name="password" required />
          </div>

          <div class="form-item">
            <label for="confirm-password">Confirm Password *</label>
            <input
              type="password"
              id="confirm-password"
              name="confirm-password"
              required
            />
          </div>

          <button type="submit">Create Account</button>
        </form>

        <p class="log-in-para">
          Already have an account? <a class="log-in" href="">Log in</a>
        </p>
      </div>
    </div>

    <footer>
      <p class="footer-para">&copy; 2026 Christa</p>
    </footer>
</body>
</html>
